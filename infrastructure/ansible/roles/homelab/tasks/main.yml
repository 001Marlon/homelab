---
- name: Clone Homelab repository
  ansible.builtin.git:
    repo: https://github.com/001Marlon/homelab.git
    dest: /homelab
    version: main
    update: true
    force: true

- name: Load homelab secrets
  ansible.builtin.set_fact:
    secrets: "{{ lookup('file', playbook_dir + '/../../../homelab-secrets.yml') | from_yaml }}"

- name: Deploy .env files for all apps
  ansible.builtin.template:
    src: env.j2
    dest: "/homelab/apps/{{ item.key }}/.env"
    mode: "0600"
  loop: "{{ secrets.apps | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  vars:
    app_vars: "{{ item.value }}"

- name: Find docker-compose.yml files for all apps
  ansible.builtin.find:
    paths: /homelab/apps
    patterns: "docker-compose.yml"
    recurse: true
  register: compose_files

- name: Start all docker compose stacks
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ item.path | dirname }}"
  loop: "{{ compose_files.files }}"
  loop_control:
    label: "{{ item.path | dirname }}"
  register: compose_up
  changed_when: "'Container' in compose_up.stderr and ('Started' in compose_up.stderr or 'Created' in compose_up.stderr or 'Recreated' in compose_up.stderr)"
