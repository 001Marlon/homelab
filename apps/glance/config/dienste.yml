- type: monitor
  cache: 5m
  title: Dienste
  hide-header: true
  sites:
    - title: Vaultwarden
      url: ${VAULTWARDEN_URL}
      headers:
        X-NetBird-Bypass-Token: ${NETBIRD_BEARER_TOKEN}
      icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/vaultwarden-light.png
    - title: Immich
      url: ${IMMICH_URL}
      headers:
        X-NetBird-Bypass-Token: ${NETBIRD_BEARER_TOKEN}
      icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/immich.png
    - title: Paperless NGX
      url: ${PAPERLESS_URL}
      headers:
        X-NetBird-Bypass-Token: ${NETBIRD_BEARER_TOKEN}
      icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/paperless-ngx.png
    - title: Jellyfin
      url: ${JELLYFIN_URL}
      headers:
        X-NetBird-Bypass-Token: ${NETBIRD_BEARER_TOKEN}
      icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/jellyfin.png

- type: monitor
