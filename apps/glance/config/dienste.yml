      icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/uptime-kuma.png
    - title: Portainer
      url: ${PORTAINER_URL}
      check-url: ${PORTAINER_URL}
      headers:
        X-NetBird-Bypass-Token: ${NETBIRD_BEARER_TOKEN}
