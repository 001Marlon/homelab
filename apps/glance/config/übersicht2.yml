- type: monitor
  hide-header: true
  cache: 5m
  sites:
    - title: Immich
      url: ${IMMICH_URL}
      headers:
        X-NetBird-Bypass-Token: ${NETBIRD_BEARER_TOKEN}
      icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/immich.png
      
- type: custom-api
  title: Immich
  hide-header: true
  cache: 60m
  template: |
    {{ $stats := newRequest "${IMMICH_URL}/api/server/statistics" | withHeader "X-NetBird-Bypass-Token" "${NETBIRD_BEARER_TOKEN}" | withHeader "x-api-key" "${IMMICH_API_KEY}" | withHeader "Accept" "application/json" | getResponse }}
    
    <div style="display: flex; justify-content: space-between; text-align: center; gap: 0.7rem;">
      <div style="flex: 1; padding: 0.7rem; background: var(--ctp-mantle, #292c3c); border-radius: 16px; border: 1px solid var(--ctp-surface0, #414559); box-shadow: 0 10px 20px rgba(0,0,0,0.3);">
        <div style="color: var(--ctp-yellow, #e5c890); font-size: 2.2rem; font-weight: bold;">{{ $stats.JSON.Int "photos" | formatNumber }}</div>
        <div style="color: var(--ctp-subtext0, #a5adce); font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-top: 0.4rem;">PHOTOS</div>
      </div>
      <div style="flex: 1; padding: 0.7rem; background: var(--ctp-mantle, #292c3c); border-radius: 16px; border: 1px solid var(--ctp-surface0, #414559); box-shadow: 0 10px 20px rgba(0,0,0,0.3);">
        <div style="color: var(--ctp-mauve, #ca9ee6); font-size: 2.2rem; font-weight: bold;">{{ $stats.JSON.Int "videos" | formatNumber }}</div>
        <div style="color: var(--ctp-subtext0, #a5adce); font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-top: 0.4rem;">VIDEOS</div>
      </div>
      <div style="flex: 1; padding: 0.7rem; background: var(--ctp-mantle, #292c3c); border-radius: 16px; border: 1px solid var(--ctp-surface0, #414559); box-shadow: 0 10px 20px rgba(0,0,0,0.3);">
        <div style="color: var(--ctp-peach, #ef9f76); font-size: 2.2rem; font-weight: bold;">{{ div ($stats.JSON.Int "usage" | toFloat) 1073741824 | toInt | formatNumber }}GB</div>
        <div style="color: var(--ctp-subtext0, #a5adce); font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-top: 0.4rem;">STORAGE</div>
      </div>
    </div>

- type: monitor
  hide-header: true
  cache: 5m
  sites:
    - title: Paperless NGX
      url: https://${PAPERLESS_URL}
      headers:
        X-NetBird-Bypass-Token: ${NETBIRD_BEARER_TOKEN}
      icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/paperless-ngx.png

- type: custom-api
  title: Paperless
  hide-header: true
  url: https://${PAPERLESS_URL}/api/statistics/
  headers:
    Authorization: Token ${PAPERLESS_KEY}
    X-NetBird-Bypass-Token: ${NETBIRD_BEARER_TOKEN}
    Accept: application/json

  cache: 60m
  template: |    
    <div style="display: flex; justify-content: space-between; gap: 0.7rem;">
      <div style="flex: 1; padding: 0.7rem; background: var(--ctp-mantle, #292c3c); border-radius: 16px; border: 1px solid var(--ctp-surface0, #414559); box-shadow: 0 10px 20px rgba(0,0,0,0.3); text-align: center;">
        <div style="color: var(--ctp-green, #a6d189); font-size: 2.2rem; font-weight: bold;">{{ .JSON.Int "documents_total" | formatNumber }}</div>
        <div style="color: var(--ctp-subtext0, #a5adce); font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-top: 0.4rem;">DOCUMENTS</div>
      </div>
      <div style="flex: 1; padding: 0.7rem; background: var(--ctp-mantle, #292c3c); border-radius: 16px; border: 1px solid var(--ctp-surface0, #414559); box-shadow: 0 10px 20px rgba(0,0,0,0.3); text-align: center;">
        <div style="color: var(--ctp-peach, #ef9f76); font-size: 2.2rem; font-weight: bold;">{{ .JSON.Int "character_count" | formatNumber }}</div>
        <div style="color: var(--ctp-subtext0, #a5adce); font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-top: 0.4rem;">CHARACTERS</div>
      </div>
    </div>
    
- type: monitor
  hide-header: true
  cache: 5m
  sites:
    - title: Jellyfin
      url: ${JELLYFIN_URL}
      headers:
        X-NetBird-Bypass-Token: ${NETBIRD_BEARER_TOKEN}
      icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/jellyfin.png
      
- type: custom-api
  title: Jellyfin
  hide-header: true
  cache: 60m
  url: ${JELLYFIN_URL}/emby/Items/Counts
  headers:
    X-NetBird-Bypass-Token: ${NETBIRD_BEARER_TOKEN}
    X-Emby-Token: ${JELLYFIN_API_KEY}
    Accept: application/json

  template: |
   
    <div style="display: flex; justify-content: space-between; gap: 0.7rem;">
      <div style="flex: 1; padding: 0.7rem; background: var(--ctp-mantle, #292c3c); border-radius: 16px; text-align: center; border: 1px solid var(--ctp-surface0, #414559); box-shadow: 0 10px 20px rgba(0,0,0,0.3);">
        <div style="color: var(--ctp-blue, #8caaee); font-size: 2.2rem; font-weight: bold;">{{ .JSON.Int "MovieCount" | formatNumber }}</div>
        <div style="color: var(--ctp-subtext0, #a5adce); font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-top: 0.4rem;">MOVIES</div>
      </div>
      <div style="flex: 1; padding: 0.7rem; background: var(--ctp-mantle, #292c3c); border-radius: 16px; text-align: center; border: 1px solid var(--ctp-surface0, #414559); box-shadow: 0 10px 20px rgba(0,0,0,0.3);">
        <div style="color: var(--ctp-mauve, #ca9ee6); font-size: 2.2rem; font-weight: bold;">{{ .JSON.Int "SeriesCount" | formatNumber }}</div>
        <div style="color: var(--ctp-subtext0, #a5adce); font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-top: 0.4rem;">SHOWS</div>
      </div>
      <div style="flex: 1; padding: 0.7rem; background: var(--ctp-mantle, #292c3c); border-radius: 16px; text-align: center; border: 1px solid var(--ctp-surface0, #414559); box-shadow: 0 10px 20px rgba(0,0,0,0.3);">
        <div style="color: var(--ctp-peach, #ef9f76); font-size: 2.2rem; font-weight: bold;">{{ .JSON.Int "EpisodeCount" | formatNumber }}</div>
        <div style="color: var(--ctp-subtext0, #a5adce); font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-top: 0.4rem;">EPISODES</div>
      </div>
    </div>
