site_name: Homelab Docs
site_url: https://docs.marlonslk.de
site_author: Marlon
site_description: Operations-first documentation for the homelab platform.

theme:
  name: material
  language: en
  logo: material/server
  favicon: material/server-network
  palette:
    - scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

nav:
  - Home: index.md
  - Platform:
      - Layout & Architecture: platform.md
      - Service Inventory: services.md
  - Operations:
      - Runbook: operations.md
      - Security Notes: security.md
  - Hardware: hardware.md
