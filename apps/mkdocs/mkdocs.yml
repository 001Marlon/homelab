site_name: Homelab Wiki
site_url: https://docs.marlonslk.de
site_author: Marlon
site_description: Dokumentation für Marlons Homelab.

theme:
  name: material
  language: de
  icon:
    logo: material/server
  favicon: material/server
  palette:
    - scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Dark Mode
    - scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Light Mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables

nav:
  - Start: index.md
  - Plattform:
      - Architektur: platform.md
      - Hardware: hardware.md
      - Services: services.md
  - Betrieb:
      - Runbook: operations.md
      - Sicherheit: security.md
  - Disaster Recovery: disaster-recovery.md
