services:
  netbird-client:
      container_name: netbird-client
      hostname: Homelab
      restart: unless-stopped
      cap_add:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
      devices:
          # Required when using userspace mode or when kernel module is not available
          - /dev/net/tun
      network_mode: host
      environment:
          - NB_SETUP_KEY=${SETUP_KEY}
          - NB_MANAGEMENT_URL=${MANAGEMENT_URL}
      volumes:
          - /homelab/apps/netbird/data:/var/lib/netbird
      image: netbirdio/netbird:latest
volumes:
  netbird-client:
      name: netbird-client
