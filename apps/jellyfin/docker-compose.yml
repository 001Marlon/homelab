# ============================================================
# Jellyfin - Mediaserver
#
# Liest die Medien nur (read-only) vom TrueNAS-Mount. Öffentlich
# unter jellyfin.marlonslk.de, ohne NetBird-Zusatzpasswort, weil
# das die Jellyfin-Apps stört (eigener Login reicht).
# ============================================================

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: "3000:3000"
    environment:
      TZ: Europe/Berlin
    volumes:
      - ./config:/config
      - ./cache:/cache
      - /homelab/data/media:/data:ro
    ports:
      - "8100:8096"
    restart: unless-stopped
    # Für Hardware-Transcoding ggf. devices: - /dev/dri/renderD128:/dev/dri/renderD128
