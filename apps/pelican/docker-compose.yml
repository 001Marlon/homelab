services:
  panel:
    image: ghcr.io/pelican/panel:latest
    container_name: pelican-panel
    restart: unless-stopped
    env_file:
      - .env
    environment:
      XDG_DATA_HOME: /pelican-data
      APP_URL: ${APP_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      BEHIND_PROXY: "true"
    ports:
      - "8005:80"
    volumes:
      - ./panel/data:/pelican-data
      - ./panel/logs:/var/www/html/storage/logs
      - ./panel/uploads.ini:/usr/local/etc/php/conf.d/zz-uploads.ini:ro
      # base image CA bundle + Wings' self-signed node cert appended, built
      # once on the host, since the container runs as non-root and can't
      # run update-ca-certificates itself
      - /etc/pelican/ssl/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro

  wings:
    image: ghcr.io/pelican/wings:latest
    container_name: pelican-wings
    restart: unless-stopped
    tty: true
    environment:
      TZ: Europe/Berlin
    ports:
      - "8080:8080"
      - "2022:2022"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers/:/var/lib/docker/containers/
      - /etc/pelican/:/etc/pelican/
      - /var/lib/pelican/:/var/lib/pelican/
      - /var/log/pelican/:/var/log/pelican/
      - /tmp/pelican/:/tmp/pelican/

  lazymc:
    build: ./lazymc
    container_name: pelican-lazymc
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      PELICAN_URL: ${APP_URL}
      PELICAN_API_KEY: ${LAZYMC_API_KEY}
      PELICAN_SERVER_UUID: ${LAZYMC_SERVER_UUID}
    ports:
      - "25565:25565"
    volumes:
      - ./lazymc/lazymc.toml:/lazymc/lazymc.toml:ro
