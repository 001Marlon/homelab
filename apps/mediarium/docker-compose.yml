# ============================================================
# Mediarium - All-in-one: Indexer, Usenet/Torrent-Download,
# Import und Umbenennen (ersetzt Sonarr/Radarr/Prowlarr/Seerr)
#
# Wichtig zum Verständnis der Volumes:
# Ein einziges /data-Volume auf den TrueNAS-Mount, damit Imports
# per Hardlink/Atomic-Move statt Kopie laufen. Filme, Serien und
# Downloads müssen deshalb im selben Dataset liegen:
#
# /homelab/data/media
# ├── movies
# ├── tv
# └── downloads
#     ├── mediarium           (Mediarium Download-Ordner)
#     └── usenet
#         └── incomplete      (SABnzbd Temp-Ordner)
#
# Torrents: Das eingebaute WireGuard-VPN im UI einrichten (ProtonVPN),
# sonst laufen Torrents über die Heim-IP. Kein Peer-Port nach außen,
# weil der Port bei aktivem VPN ohnehin nicht genutzt wird.
# ============================================================

services:
  mediarium:
    image: ghcr.io/rdborg/mediarium:latest
    container_name: mediarium
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "8109:8264"
    environment:
      PUID: 3000
      PGID: 3000
      UMASK: "002"
      TZ: Europe/Berlin
      DOWNLOADS_DIR: /data/downloads/mediarium
      MOVIES_DIR: /data/movies
      TV_DIR: /data/tv
    volumes:
      - ./config:/config
      - /homelab/data/media:/data
